spring.application.name=newsletter-api

#spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/newsletter_db}
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:newsletter_db}

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

server.port=9000

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

logging.level.com.newsletter=DEBUG
logging.level.org.springframework.security=INFO

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n